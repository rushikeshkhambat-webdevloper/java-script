 calculate its body max index  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Porject2</title>
    <link rel="stylesheet" href="style2.css">
 </head>
 <body>
    <div class="container">
       <h1> BMI(Body Mass Index) Calculator </h1>
       <form class="health">
        <p> <label>Enter your height in CM: </label> <input type="text" id="height"></p>
        <p> <label>Enter your weight in KG: </label><input type="text" id="weight"></p>
        <button>calculate</button>
        <div id="result"></div>
        <div id="result2"></div>
       </form>
       <div class="guidelines">
        <h3> Some of the guidelines</h3>
        <P>Under weight: Bmi less than 18.6</P>
        <p> Normal Range: 18.6 to 24.9</p>
        <p> Overweight: Bmi is greater than 24.9</p>
       </div>
    </div>
 </body>
 <script src="project2.js"></script>
 </html>
